## IDF Component Manifest for the future Tab5 main component.
dependencies:
  idf:
    version: ">=5.3.0"
  espressif/m5stack_tab5:
    version: "^1.2.0~1"
  # Tab5 units built from 2026-04-28 carry an ST7121 panel where the BSP only
  # knows the ST7123 it replaced, so the ST7121 driver comes in alongside it and
  # display_tab5.c brings that panel up itself. See boards/TAB5/README.md.
  espressif/esp_lcd_st7121:
    version: "^1.0.1"
    rules:
      - if: "target == esp32p4"
  # Adding the line above re-resolves everything the BSP pulls in, and
  # esp_lvgl_port 2.9.0 wants an esp_lcd DPI callback that does not exist before
  # ESP-IDF 6. Hold it at the 2.8 series this port builds against.
  espressif/esp_lvgl_port:
    version: "~2.8.0"
  espressif/mdns:
    version: "~1.1.0"
  # Runtime ELF loading for tulip.install_c_process() user DSP: user code is
  # compiled on-device by tulip/shared/3rdparty/rcc700 (the RISC-V twin of the
  # xcc700 compiler AMYboard uses) and loaded into PSRAM. Same series as AMYboard.
  espressif/elf_loader:
    version: "~1.3.1"
  # Adding any direct dependency re-resolves the whole tree, and left alone that
  # moved two things nobody asked to move: LVGL to 9.6.0 (the MicroPython binding
  # is generated from its headers) and esp_sccb_intf to 0.0.9 (the camera's
  # sensor bus). Hold both where the lock had them.
  lvgl/lvgl:
    version: "9.5.0"
  espressif/esp_sccb_intf:
    version: "0.0.8"
  espressif/tinyusb:
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4]"
    # Temporary workaround for https://github.com/hathach/tinyusb/issues/3154
    # Can be removed once fix is released in espressif/tinyusb
    git: https://github.com/micropython/tinyusb-espressif.git
    version: cherrypick/dwc2_zlp_fix
  espressif/esp_hosted:
    rules:
      - if: "target == esp32p4"
    version: "2.7.0"
  espressif/esp_wifi_remote:
    rules:
      - if: "target == esp32p4"
    version: "0.15.2"
  espressif/lan867x:
    version: "~1.0.0"
    rules:
      - if: "target == esp32"
