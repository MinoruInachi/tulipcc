## IDF Component Manager Manifest File
dependencies:
  idf:
    version: ">=5.3.0"
  espressif/mdns: "~1.1.0"
  # TinyUSB comes from the component manager as of micropython v1.29 (it used
  # to be built from micropython/lib/tinyusb). Same source as the stock port.
  espressif/tinyusb:
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4]"
    # Temporary workaround for https://github.com/hathach/tinyusb/issues/3154
    # Can be removed once fix is released in espressif/tinyusb
    git: https://github.com/micropython/tinyusb-espressif.git
    version: cherrypick/dwc2_zlp_fix
  # Runtime ELF loading for tulip.install_c_process() user DSP (user code is
  # compiled on-device by tulip/shared/3rdparty/xcc700 and loaded into PSRAM).
  espressif/elf_loader: "~1.3.1"
